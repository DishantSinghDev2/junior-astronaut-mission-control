<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lunar Outpost</title>
  <meta name="description" content="Lunar Outpost: explore Mars or the Moon in a cartoon top-down world. Walk, drive the rover, fix the base and survive real NASA solar storms. Team Pheonix – NASA Space Apps Challenge 2026.">
  <meta name="theme-color" content="#0a1236">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=27">
</head>
<body>
  <!-- menu screens (loading, home, destination, landing-site globe, briefing, sources, results) -->
  <div class="wm" aria-hidden="true">LUNAR OUTPOST · TEAM PHEONIX · SPACE APPS 2026</div>
  <main id="app" aria-live="polite"></main>

  <!-- the playable world: canvas fills the screen, HUD floats on top -->
  <section id="game" hidden aria-label="Lunar Outpost game">
    <canvas id="world" aria-label="Your outpost seen from above. Move with arrow keys or WASD, or tap to walk. Press E or Space to use things."></canvas>
    <div id="hud"></div>
    <div class="ticker" id="g-ticker" role="status"></div>
    <div class="toast" id="g-toast" hidden></div>
    <!-- story cutscene layer -->
    <div id="cine" hidden>
      <div class="lbox top"></div><div class="lbox bottom"></div>
      <div class="cine-title" id="cine-title" hidden><small>NASA Space Apps · Team Pheonix</small>Lunar Outpost</div>
      <p class="subtitle" id="cine-sub"></p>
      <button class="btn-secondary sm skip" id="cine-skip">Skip story ›</button>
    </div>
  </section>

  <div id="modal" class="overlay" hidden><div class="modal-box" role="dialog" aria-modal="true"></div></div>

  <div id="popup" class="overlay top" hidden>
    <div class="modal-box small" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <h3 id="popup-title"></h3>
      <p id="popup-text"></p>
      <button class="btn-primary" id="popup-close">Got it</button>
    </div>
  </div>

  <div class="corner-btns">
    <button id="btn-sound" class="a11y" aria-pressed="false" aria-label="Sound on or off"></button>
    <button id="btn-a11y" class="a11y" aria-pressed="false" aria-label="Bigger text">A+</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/config.js?v=27"></script>
  <script src="js/icons.js?v=27"></script>
  <script src="js/data-events.js?v=27"></script>
  <script src="js/donki-archive.js?v=27"></script>
  <script src="js/donki.js?v=27"></script>
  <script src="js/audio.js?v=27"></script>
  <script src="js/sunwatch.js?v=27"></script>
  <script src="js/globe.js?v=27"></script>
  <script src="js/minigames.js?v=27"></script>
  <script src="js/multiplayer.js?v=27"></script>
  <script src="js/world.js?v=27"></script>
  <script src="js/game.js?v=27"></script>
</body>
</html>
